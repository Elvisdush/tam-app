# Copy to secrets.yaml, fill values, then: kubectl apply -f secrets.yaml
# NEVER commit secrets.yaml to git.
apiVersion: v1
kind: Secret
metadata:
  name: tam-secrets
  namespace: tam-app
type: Opaque
stringData:
  REDIS_PASSWORD: "change-me-redis-password"
  JWT_SECRET: "change-me-jwt-secret-min-32-chars-long"
  JWT_REFRESH_SECRET: "change-me-refresh-secret-min-32-chars"
  RABBITMQ_USER: "tam"
  RABBITMQ_PASSWORD: "change-me-rabbitmq-password"
