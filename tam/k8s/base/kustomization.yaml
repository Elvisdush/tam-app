apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tam-app

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: tam
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - redis.yaml
  - rabbitmq.yaml
  - backend.yaml
  - ingress.yaml

# secrets.yaml is applied separately (see KUBERNETES_DEPLOYMENT.md)
