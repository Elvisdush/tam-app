apiVersion: apps/v1
kind: Deployment
metadata:
  name: tam-backend
  labels:
    app.kubernetes.io/name: tam-backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tam-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tam-backend
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: backend
          image: tam-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3006
              name: http
          envFrom:
            - configMapRef:
                name: tam-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tam-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tam-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: tam-secrets
                  key: JWT_REFRESH_SECRET
            - name: AMQP_USER
              valueFrom:
                secretKeyRef:
                  name: tam-secrets
                  key: RABBITMQ_USER
            - name: AMQP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tam-secrets
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tam-backend
  labels:
    app.kubernetes.io/name: tam-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tam-backend
  ports:
    - name: http
      port: 80
      targetPort: 3006
